version: '3.8'

services:
  anton:
    build: .
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GH_TOKEN=${GH_TOKEN}
    volumes:
      - ./.anton:/app/.anton
    restart: always

  restate:
    image: ghcr.io/restatedev/restate:latest
    ports:
      - "8080:8080"
      - "9070:9070"
      - "9071:9071"
